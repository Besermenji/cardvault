# Actions are pinned by commit SHA; this keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR per month for all action bumps instead of one per action.
    groups:
      actions:
        patterns: ["*"]
  # The pinned design.md CLI used by tools/lint_design.sh (not part of the firmware).
  - package-ecosystem: npm
    directory: /tools/design-lint
    schedule:
      interval: monthly
    groups:
      design-lint:
        patterns: ["*"]
