name: Release

on:
  push:
    tags: ["v*"]

# Nothing is writable unless a job asks for it. Only `publish` and `pages` hold
# write tokens, and neither checks out or runs repository code.
permissions: {}

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Version matches tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="${v%%-*}"   # v0.1.0-rc1 -> 0.1.0
          grep -q "#define CV_VERSION \"$base\"" src/version.h || {
            echo "src/version.h does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Changelog has a section for this version
        run: tools/release_notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit must have been built by ci.yml itself (normally the push to main that merged
          # it): a green run for a later commit says nothing about this one. A run that exists but
          # has not finished is waited for (up to ~25 min); a missing run is given a minute to appear.
          missing=0
          for _ in $(seq 1 75); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion \
                    --jq 'if length == 0 then "none" else "\(.[0].status) \(.[0].conclusion)" end')
            echo "ci.yml on $GITHUB_SHA: $run"
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*) echo "CI did not succeed for this commit"; exit 1 ;;
              none)
                missing=$((missing + 1))
                if [ "$missing" -ge 4 ]; then
                  echo "ci.yml never ran for $GITHUB_SHA; tag a commit that CI built (the tip of main)"
                  exit 1
                fi ;;
            esac
            sleep 20
          done
          echo "CI did not finish in time"; exit 1

  build:
    name: Build and check
    # No needs: the build holds no write token, so it runs beside the CI wait in `verify`.
    # `publish` needs both.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Donation addresses and QR codes match everywhere
        run: |
          pip install -r tools/support-requirements.txt
          python3 tools/support.py
          # Read, never source, the file; support.py has checked both values are plain alphanumerics.
          echo "BTC=$(sed -n 's/^BTC=//p' docs/support/addresses.env)" >> "$GITHUB_ENV"
          echo "ETH=$(sed -n 's/^ETH=//p' docs/support/addresses.env)" >> "$GITHUB_ENV"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Test and build
        run: |
          python3 tools/check_release_flags.py
          pio test -e native
          pio run -e cardputer

      - name: Merge image, checking vault address and test or debug code
        run: tools/merge_bin.sh "${GITHUB_REF_NAME#v}" release

      - name: Release notes
        run: |
          tools/release_notes.sh "$GITHUB_REF_NAME" > notes.md
          printf '\n### Support\n\n- BTC `%s`\n- ETH `%s`\n' "$BTC" "$ETH" >> notes.md

      - name: Prepare web flasher
        run: |
          tools/check_flasher.sh
          mkdir -p site
          cp -r docs/flasher/* site/
          img=$(ls release/cardvault-*-cardputer-adv.bin)
          cp "$img" site/cardvault.bin
          sha=$(sha256sum "$img" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${GITHUB_REF_NAME#v}/g" site/manifest.json site/index.html
          sed -i "s/__SHA256__/$sha/; s/__BTC__/$BTC/; s/__ETH__/$ETH/" site/index.html
          grep -qF "$sha" site/index.html || { echo "image hash missing from the flasher"; exit 1; }
          grep -qF "$BTC" site/index.html || { echo "BTC address missing from the flasher"; exit 1; }
          grep -qF "$ETH" site/index.html || { echo "ETH address missing from the flasher"; exit 1; }
          if grep -nE '__[A-Z0-9]+__' site/index.html site/manifest.json; then
            echo "unfilled placeholder in the flasher"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            release/
            notes.md
          if-no-files-found: error

      # The public flasher is replaced only by a final release (no -rc/-beta tag).
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !github.event.repository.private && !contains(github.ref_name, '-') }}
        with:
          path: site

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      # Attestations are not available for private repositories on this plan.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*.bin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CardVault $GITHUB_REF_NAME" --notes-file notes.md $pre

  pages:
    name: Deploy web flasher
    needs: publish
    if: ${{ !github.event.repository.private && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
