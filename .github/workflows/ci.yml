name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Its own job, so a DESIGN.md problem never hides a firmware test or build failure (or the reverse).
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: DESIGN.md is valid and matches theme.h and layout.h
        run: python3 tools/check_design_sync.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Donation addresses and QR codes match everywhere
        run: |
          pip install -r tools/support-requirements.txt
          python3 tools/support.py

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e cardputer

      - name: Check firmware size budget
        run: |
          size=$(stat -c %s .pio/build/cardputer/firmware.bin)
          budget=$((2 * 1024 * 1024))  # stay well under the 3 MB app slot (Launcher-friendly)
          echo "firmware.bin: $size bytes (budget $budget)"
          test "$size" -le "$budget"

      - name: Web flasher has no external code and a strict CSP
        run: tools/check_flasher.sh

      - name: Release environment is a plain build
        run: python3 tools/check_release_flags.py

      - name: Merge image, checking vault address and test or debug code
        run: tools/merge_bin.sh "ci-${GITHUB_SHA::7}" release

      - name: Debug, e2e and on-device test builds compile
        run: |
          pio run -e cardputer-debug
          pio run -e cardputer-e2e
          pio test -e cardputer-test --without-uploading --without-testing

      # Positive controls: the release check must reject images that really do
      # contain what it looks for, otherwise a passing check proves nothing.
      - name: Release image check rejects debug and e2e images
        run: |
          expect_fail() {  # <env> <reason>...
            env_name=$1; shift
            tools/merge_bin.sh control control-out "$env_name"
            img="control-out/cardvault-vcontrol-${env_name}-NOT-FOR-RELEASE.bin"
            if tools/check_release_image.sh "$img" 2> control.err; then
              echo "check accepted the $env_name image"; exit 1
            fi
            for reason in "$@"; do
              grep -qF "$reason" control.err || {
                echo "check did not report '$reason' for $env_name:"; cat control.err; exit 1; }
            done
          }
          expect_fail cardputer-debug "no 'vault' partition" "test partition 'cvtvault'" "marker: CVSHOT" "marker: cvtvault"
          expect_fail cardputer-e2e "no 'vault' partition" "test partition 'cvtvault'" "marker: CVTEST" "marker: unknown command"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardvault-firmware
          path: release/
