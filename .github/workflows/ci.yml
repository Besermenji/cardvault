name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Its own job, so a DESIGN.md problem never hides a firmware test or build failure (or the reverse).
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: DESIGN.md is valid and matches theme.h and layout.h
        run: python3 tools/check_design_sync.py
      - name: Every image the README and the update guide show is in the repository
        run: |
          missing=0
          for f in $(grep -o 'docs/screenshots/[A-Za-z0-9_-]*\.png' README.md | sort -u); do
            [ -f "$f" ] || { echo "README links $f, which does not exist"; missing=1; }
          done
          for f in $(grep -o '(screenshots/[A-Za-z0-9_-]*\.png' docs/UPDATING.md | tr -d '(' | sort -u); do
            [ -f "docs/$f" ] || { echo "docs/UPDATING.md links $f, which does not exist"; missing=1; }
          done
          exit $missing

  # Its own job: until the release key is set, this fails without hiding the build's results.
  update-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SD update keys match their .pub.pem files and the release key is real
        run: python3 tools/check_update_key.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Donation addresses and QR codes match everywhere
        run: |
          pip install -r tools/support-requirements.txt
          python3 tools/support.py

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e cardputer

      - name: Check firmware size budget
        run: |
          size=$(stat -c %s .pio/build/cardputer/firmware.bin)
          budget=$((2 * 1024 * 1024))  # stay well under the 3 MB app slot (Launcher-friendly)
          echo "firmware.bin: $size bytes (budget $budget)"
          test "$size" -le "$budget"

      - name: Web flasher has no external code and a strict CSP
        run: tools/check_flasher.sh

      - name: Release environment is a plain build
        run: python3 tools/check_release_flags.py

      - name: Merge image, checking vault address and test or debug code
        run: tools/merge_bin.sh "ci-${GITHUB_SHA::7}" release

      # Positive control: a manifest that writes the merged image (which blanks NVS) must fail.
      - name: Flasher parts check rejects installing the merged image
        run: |
          printf '{"builds":[{"parts":[{"path":"cardvault.bin","offset":0}]}]}' > merged-manifest.json
          if python3 tools/check_flash_parts.py release "cardvault-vci-${GITHUB_SHA::7}-cardputer-adv" \
               --manifest merged-manifest.json; then
            echo "check accepted a manifest that installs the merged image"; exit 1
          fi
          sed 's/32768/36864/' docs/flasher/manifest.json > nvs-manifest.json
          if python3 tools/check_flash_parts.py release "cardvault-vci-${GITHUB_SHA::7}-cardputer-adv" \
               --manifest nvs-manifest.json; then
            echo "check accepted a part written into NVS"; exit 1
          fi

      # The release job signs with OpenSSL the same way, with the real key.
      - name: SD update file builds and checks (test key), and fails with another key
        run: |
          python3 tools/make_update.py build --image .pio/build/cardputer/firmware.bin \
            --key tools/e2e/update_test_key.pem --out ci.cvu
          python3 tools/make_update.py check --pubkey tools/e2e/update_test_key.pub.pem ci.cvu
          openssl genpkey -algorithm ed25519 -out other.pem
          openssl pkey -in other.pem -pubout -out other.pub.pem
          if python3 tools/make_update.py check --pubkey other.pub.pem ci.cvu; then
            echo "check accepted a file signed with another key"; exit 1
          fi

      - name: Debug, e2e and on-device test builds compile
        run: |
          pio run -e cardputer-debug
          pio run -e cardputer-e2e
          pio test -e cardputer-test --without-uploading --without-testing

      # Positive controls: the release check must reject images that really do
      # contain what it looks for, otherwise a passing check proves nothing.
      - name: Release image check rejects debug and e2e images
        run: |
          expect_fail() {  # <env> <reason>...
            env_name=$1; shift
            tools/merge_bin.sh control control-out "$env_name"
            img="control-out/cardvault-vcontrol-${env_name}-NOT-FOR-RELEASE.bin"
            if tools/check_release_image.sh "$img" 2> control.err; then
              echo "check accepted the $env_name image"; exit 1
            fi
            for reason in "$@"; do
              grep -qF "$reason" control.err || {
                echo "check did not report '$reason' for $env_name:"; cat control.err; exit 1; }
            done
          }
          expect_fail cardputer-debug "no 'vault' partition" "test partition 'cvtvault'" "marker: CVSHOT" "marker: cvtvault" "test update key"
          expect_fail cardputer-e2e "no 'vault' partition" "test partition 'cvtvault'" "marker: CVTEST" "marker: unknown command" "test update key"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardvault-firmware
          path: release/
