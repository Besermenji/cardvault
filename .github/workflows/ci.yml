name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Donation addresses and QR codes match everywhere
        run: |
          pip install segno==1.6.6 zxing-cpp==3.1.1 numpy==2.5.4
          python3 tools/support.py

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware
        run: pio run -e cardputer

      - name: Check firmware size budget
        run: |
          size=$(stat -c %s .pio/build/cardputer/firmware.bin)
          budget=$((2 * 1024 * 1024))  # stay well under the 3 MB app slot (Launcher-friendly)
          echo "firmware.bin: $size bytes (budget $budget)"
          test "$size" -le "$budget"

      - name: Release build must not contain debug or test code
        run: |
          for marker in CVSHOT "CVTEST READY" cvt_guard "unknown command"; do
            if LC_ALL=C grep -a -q "$marker" .pio/build/cardputer/firmware.bin; then
              echo "release firmware contains test/debug marker: $marker"; exit 1
            fi
          done

      - name: Debug, e2e and on-device test builds compile
        run: |
          pio run -e cardputer-debug
          pio run -e cardputer-e2e
          pio test -e cardputer-test --without-uploading --without-testing

      - name: Merge image
        run: tools/merge_bin.sh "ci-${GITHUB_SHA::7}" release

      - uses: actions/upload-artifact@v4
        with:
          name: cardvault-firmware
          path: release/
