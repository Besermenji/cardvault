; CardVault — PlatformIO configuration
; Versions are pinned for reproducible builds.

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter =
    +<*>
    -<**/*_host.cpp>
lib_deps =
    m5stack/M5Cardputer@1.1.1
test_ignore = *

; Debug build with a screenshot hotkey (ctrl+s dumps the screen over USB
; serial). It can send revealed values to the computer, so it lives on the
; test partition table and NVS namespaces and refuses to start anywhere
; else: a real vault is never mounted. Release builds use env:cardputer only.
[env:cardputer-debug]
extends = env:cardputer
board_build.partitions = partitions_test.csv
build_flags =
    ${env:cardputer.build_flags}
    -DCV_NVS_GUARD=\"cvt_guard\"
    -DCV_NVS_CFG=\"cvt_cfg\"
    -DCV_SCREENSHOT=1

; On-device integration tests (pio test -e cardputer-test). Separate vault
; partition (0x410000) and NVS namespaces: a real vault is never touched.
[env:cardputer-test]
extends = env:cardputer
board_build.partitions = partitions_test.csv
build_flags =
    ${env:cardputer.build_flags}
    -DCV_NVS_GUARD=\"cvt_guard\"
    -DCV_NVS_CFG=\"cvt_cfg\"
build_src_filter =
    +<*>
    -<**/*_host.cpp>
    -<main.cpp>
    -<ui/>
    +<ui/textwrap.cpp>
test_framework = unity
test_ignore =
test_filter = test_device_*
test_build_src = yes

; End-to-end test firmware (tools/e2e/run.py drives it over USB serial).
; Same isolation as cardputer-test; attempt delays shortened 50x.
[env:cardputer-e2e]
extends = env:cardputer
board_build.partitions = partitions_test.csv
build_flags =
    ${env:cardputer.build_flags}
    -DCV_NVS_GUARD=\"cvt_guard\"
    -DCV_NVS_CFG=\"cvt_cfg\"
    -DCV_TEST_HOOKS=1
    -DCV_TEST_DELAY_DIV=50
    -DCV_REVEAL_MS=4000

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Isrc
build_src_filter =
    +<crypto/>
    +<vault/>
    +<features/>
    +<security/>
    +<core/>
    +<ui/textwrap.cpp>
    -<**/*_esp.cpp>
test_build_src = yes
test_ignore = test_device_*
