; CardVault — PlatformIO configuration
; Versions are pinned for reproducible builds.

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter =
    +<*>
    -<**/*_host.cpp>
lib_deps =
    m5stack/M5Cardputer@1.1.1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Isrc
build_src_filter =
    +<crypto/>
    +<vault/>
    +<features/>
    +<security/>
    -<**/*_esp.cpp>
test_build_src = yes
